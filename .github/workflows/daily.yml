name: International stock screener pilot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily.yml'
      - 'screener.py'
      - 'test_screener.py'
  schedule:
    # UTC 22:00 Monday-Friday = 06:00 Tuesday-Saturday Perth
    - cron: '0 22 * * 1-5'
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python global_probe.py
      - run: python screener.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: international-screener-pilot-report
          path: reports/
          retention-days: 30
