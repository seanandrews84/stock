name: International stock screener — morning review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily.yml'
      - 'pipeline.py'
      - 'consolidate.py'
      - 'test_pipeline.py'
      - 'full_scan.py'
      - 'screener.py'
      - 'data/broker_verified.csv'
      - 'requirements.txt'
  schedule:
    # 06:00 Perth Tue-Sat = 22:00 UTC Mon-Fri; GitHub may delay scheduled starts.
    - cron: '0 22 * * 1-5'
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and regression tests
        run: pytest -q
      - name: Diagnose ETF provider fields (test only)
        if: github.event_name == 'push' && matrix.shard == 0
        run: python diagnose_etfs.py
      - name: Screen international stocks and ETFs — shard ${{ matrix.shard }}
        run: python pipeline.py --shards 8 --shard-number ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: international-shard-${{ matrix.shard }}
          path: reports/screen_shard_*.json
          if-no-files-found: warn
          retention-days: 30
  summary:
    if: always()
    needs: screen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: international-shard-*
          path: shard_downloads
          merge-multiple: false
      - name: Consolidate into one US-style report and audit coverage
        run: python consolidate.py
      - name: Publish report into GitHub run summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: international-morning-report
          path: |
            reports/latest.md
            reports/latest.json
          retention-days: 30
